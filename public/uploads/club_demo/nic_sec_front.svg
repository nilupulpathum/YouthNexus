<!-- Smart Chip -->
<rect x="160" y="66" width="54" height="42" rx="6" fill="#fbbf24" stroke="#d97706" stroke-width="1.5" />
<line x1="160" y1="87" x2="214" y2="87" stroke="#b45309" stroke-width="1.5" />
<line x1="187" y1="66" x2="187" y2="108" stroke="#b45309" stroke-width="1.5" />

<!-- Details -->
<text x="230" y="80" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="10" font-weight="700" fill="#64748b">NIC NUMBER</text>
<text x="230" y="100" font-family="Courier, monospace" font-size="18" font-weight="900" fill="#1e40af">199856789123</text>

<text x="160" y="132" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="9" font-weight="700" fill="#64748b">FULL NAME</text>
<text x="160" y="150" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" font-weight="800" fill="#0f172a">Kavindi Jayawardena</text>

<text x="160" y="178" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="9" font-weight="700" fill="#64748b">DATE OF BIRTH</text>
<text x="160" y="196" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#0f172a">1998-08-20</text>

<text x="320" y="178" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="9" font-weight="700" fill="#64748b">GENDER</text>
<text x="320" y="196" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#0f172a">FEMALE</text>

<!-- Hologram Watermark -->
<rect x="380" y="66" width="116" height="150" rx="8" fill="#e0f2fe" opacity="0.6" stroke="#bae6fd" stroke-width="1.5" stroke-dasharray="4,3" />
<text x="438" y="145" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11" font-weight="900" fill="#0284c7" text-anchor="middle">HOLOGRAM</text>
<text x="438" y="165" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="9" font-weight="700" fill="#0369a1" text-anchor="middle">SECURE CHIP</text>

<!-- Footer -->
<rect x="0" y="272" width="520" height="48" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
<rect x="0" y="272" width="520" height="24" fill="#f8fafc" />
<text x="24" y="296" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="10" font-weight="700" fill="#475569">DEPT. OF REGISTRATION OF PERSONS &bull; SRI LANKA</text>
<text x="496" y="296" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="10" font-weight="800" fill="#16a34a" text-anchor="end">&check; VERIFIED SPECIMEN</text>

