<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">

<defs>
  <linearGradient id="gradLogo" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#1e40af" />
    <stop offset="100%" stop-color="#0f172a" />
  </linearGradient>
  <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#fbbf24" />
    <stop offset="100%" stop-color="#d97706" />
  </linearGradient>
</defs>
<rect width="300" height="300" rx="40" fill="url(#gradLogo)" />
<circle cx="150" cy="150" r="110" fill="none" stroke="url(#goldRing)" stroke-width="6" stroke-dasharray="6,4" />
<circle cx="150" cy="150" r="95" fill="#1e3a8a" stroke="#ffffff" stroke-width="2" />
<!-- Mountain Emblem -->
<polygon points="150,70 195,150 105,150" fill="#38bdf8" opacity="0.9" />
<polygon points="120,110 160,180 80,180" fill="#0284c7" opacity="0.8" />
<polygon points="180,115 220,180 140,180" fill="#0369a1" opacity="0.8" />
<!-- Compass Star -->
<polygon points="150,130 155,145 170,150 155,155 150,170 145,155 130,150 145,145" fill="#fbbf24" />
<text x="150" y="215" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">YOUTH ROVERS</text>
<text x="150" y="235" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="10" font-weight="700" fill="#fbbf24" text-anchor="middle" letter-spacing="1">ADVENTURE GUILD</text>

</svg>