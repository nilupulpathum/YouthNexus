<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="100%" height="100%">

<defs>
  <linearGradient id="nicBg_nic_sec_front.svg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#eff6ff" />
    <stop offset="100%" stop-color="#dbeafe" />
  </linearGradient>
</defs>
<rect width="520" height="320" rx="16" fill="url(#nicBg_nic_sec_front.svg)" stroke="#93c5fd" stroke-width="2" />
<!-- Header Bar -->
<rect x="0" y="0" width="520" height="48" rx="16" fill="#1e40af" />
<rect x="0" y="24" width="520" height="24" fill="#1e40af" />
<!-- Coat of arms circle -->
<circle cx="36" cy="24" r="14" fill="#fbbf24" />
<text x="60" y="22" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" font-weight="900" fill="#ffffff" letter-spacing="1">DEMOCRATIC SOCIALIST REPUBLIC OF SRI LANKA</text>
<text x="60" y="38" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="10" font-weight="600" fill="#bfdbfe">NATIONAL IDENTITY CARD (FRONT)</text>

<!-- Photo Box -->
<rect x="24" y="66" width="120" height="150" rx="8" fill="#1e40af" stroke="#cbd5e1" stroke-width="2" />
<circle cx="84" cy="120" r="30" fill="#ffffff" opacity="0.9" />
<ellipse cx="84" cy="180" rx="45" ry="30" fill="#ffffff" opacity="0.9" />
